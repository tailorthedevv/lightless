      const startY = -((Math.floor(oy) % h + h) % h);
      for (let y = startY; y < PIXEL_H + 2; y += h) {
        for (let x = startX; x < PIXEL_W + 2; x += w) {
          ctx.drawImage(img, x, y);
        }
      }
    }

    renderBlurredForeground(dctx, dispW, dispH, camX, camY) {
      const sxScale = dispW / PIXEL_W;
      const syScale = dispH / PIXEL_H;
      const pad = 14;
      const fgX = camX * 1.3;
      const fgY = camY * 1.3;

      dctx.save();
      dctx.imageSmoothingEnabled = true;

      const topW = 260;
      const startTop = -((Math.floor(fgX) % (topW * 2) + topW * 2) % (topW * 2));
      for (let idx = 0, x = startTop; x < PIXEL_W + topW; x += topW, idx++) {
        const chunk = this.assets.dofTopChunks[idx % this.assets.dofTopChunks.length];
        dctx.drawImage(
          chunk,
          (x - pad) * sxScale,
          (-pad - (fgY % 12) * 0.25) * syScale,
          chunk.width * sxScale,
          chunk.height * syScale
        );
      }

      const botW = 260;
      const startBot = -((Math.floor(fgX + 90) % (botW * 2) + botW * 2) % (botW * 2));
      for (let idx = 0, x = startBot; x < PIXEL_W + botW; x += botW, idx++) {
        const chunk = this.assets.dofBottomChunks[idx % this.assets.dofBottomChunks.length];
        dctx.drawImage(
          chunk,
          (x - pad) * sxScale,
          (PIXEL_H - 36 - pad) * syScale,
          chunk.width * sxScale,
          chunk.height * syScale
        );
      }

      const spire = this.assets.dofSideSpire;
      const sideBob = -((fgY * 0.3) % 60);
      dctx.drawImage(spire, (-18 - pad) * sxScale, (sideBob - pad) * syScale, spire.width * sxScale, spire.height * syScale);
      dctx.save();
      dctx.translate(dispW, 0);
      dctx.scale(-1, 1);
      dctx.drawImage(spire, (-18 - pad) * sxScale, (65 + sideBob - pad) * syScale, spire.width * sxScale, spire.height * syScale);
      dctx.restore();

      dctx.restore();
    }

    renderHUDAndOverlays(dctx, dispW, dispH) {
      const scale = dispW / PIXEL_W;
      dctx.save();
      dctx.imageSmoothingEnabled = false;
      dctx.scale(scale, scale);

      const secTitle = `SEC-0${this.sectorIndex === 0 ? '4' : this.sectorIndex === 1 ? '7' : '9'}`;
      drawPixelText(dctx, secTitle, 8, 8, 'rgba(200, 225, 250, 0.58)', '#030408');
      drawPixelText(dctx, this.audio.muted ? 'M:OFF' : 'M:SFX', 42, 8, 'rgba(180, 205, 235, 0.38)');

      const hudX = PIXEL_W - 64;
      const hudY = 8;
      dctx.fillStyle = 'rgba(6, 10, 20, 0.55)';
      dctx.fillRect(hudX - 4, hudY - 3, 60, 12);
      dctx.drawImage(this.assets.shardFrames[0], hudX - 2, hudY - 4, 9, 10);
      drawPixelText(dctx, `${this.totalShardsCollected}/15`, hudX + 9, hudY + 1, '#eef4ff', '#030408');

      const orbOn = this.level.orb && this.level.orb.activated;
      dctx.fillStyle = orbOn ? this.level.palette.orbColor : '#3a4a63';
      dctx.fillRect(hudX + 41, hudY + 1, 5, 5);
      if (orbOn) {
        dctx.fillStyle = '#ffffff';
        dctx.fillRect(hudX + 42, hudY + 2, 3, 3);
      }

      if (this.hintAlpha > 0.02 && this.awakened) {
        dctx.globalAlpha = this.hintAlpha * 0.85;
        const hint = 'WASD / ARROWS MOVE • SPACE JUMP • S DROP • R CHECKPOINT';
        const hw = measurePixelText(hint) + 10;
        const hx = Math.round((PIXEL_W - hw) * 0.5);
        const hy = PIXEL_H - 22;
        dctx.fillStyle = 'rgba(4, 8, 18, 0.68)';
        dctx.fillRect(hx, hy - 3, hw, 11);
        drawPixelText(dctx, hint, hx + 5, hy, '#dce9fa', '#030408');
        dctx.globalAlpha = 1;
      }

      if (this.bannerTimer > 0) {
        const alpha = clamp(Math.min(this.bannerTimer, 3.5 - this.bannerTimer + 0.6) * 1.4, 0, 1);
        dctx.globalAlpha = alpha;
        const bw = measurePixelText(this.bannerText) + 14;
        const bx = Math.round((PIXEL_W - bw) * 0.5);
        const by = 22;
        dctx.fillStyle = 'rgba(8, 12, 26, 0.82)';
        dctx.fillRect(bx, by - 3, bw, 11);
        dctx.fillStyle = this.level.palette.orbColor;
        dctx.fillRect(bx, by - 3, bw, 1);
        drawPixelText(dctx, this.bannerText, bx + 7, by, '#ffffff', '#030408');
        dctx.globalAlpha = 1;
      }

      if (this.finaleActive && this.finaleTimer > 1.4) {
        const cardAlpha = clamp((this.finaleTimer - 1.4) * 1.2, 0, 1);
        dctx.globalAlpha = cardAlpha;
        const mins = String(Math.floor(this.runTime / 60)).padStart(2, '0');
        const secs = String(Math.floor(this.runTime % 60)).padStart(2, '0');
        const rows = [
          'SURFACE RELAY ONLINE',
          'ALL SECTORS SYNCHRONIZED',
          `SHARDS RECOVERED: ${this.totalShardsCollected} / 15`,
          `DATA LOGS DECODED: ${this.totalLogsRead.size} / 6`,
          `ASCENT TIME: ${mins}:${secs}`,
          '[R] REPLAY CAMPAIGN'
        ];
        const cardW = 166;
        const cardH = 74;
        const cx = Math.round((PIXEL_W - cardW) * 0.5);
        const cy = 42;
        dctx.fillStyle = 'rgba(4, 9, 20, 0.88)';
        dctx.fillRect(cx, cy, cardW, cardH);
        dctx.fillStyle = '#99f6ff';
        dctx.fillRect(cx, cy, cardW, 1);
        dctx.fillRect(cx, cy + cardH - 1, cardW, 1);

        drawPixelText(dctx, rows[0], cx + Math.round((cardW - measurePixelText(rows[0])) * 0.5), cy + 7, '#ffffff', '#030408');
        drawPixelText(dctx, rows[1], cx + Math.round((cardW - measurePixelText(rows[1])) * 0.5), cy + 16, '#99f6ff', '#030408');
        drawPixelText(dctx, rows[2], cx + 14, cy + 29, '#ff8fa3', '#030408');
        drawPixelText(dctx, rows[3], cx + 14, cy + 38, '#6ee89a', '#030408');
        drawPixelText(dctx, rows[4], cx + 14, cy + 47, '#ffe38f', '#030408');
        drawPixelText(dctx, rows[5], cx + Math.round((cardW - measurePixelText(rows[5])) * 0.5), cy + 60, '#dce9fa', '#030408');
        dctx.globalAlpha = 1;
      }

      let blackAlpha = this.transitionAlpha;
      if (!this.awakened && this.wakeTimer < 0.7) {
        blackAlpha = Math.max(blackAlpha, clamp(1 - this.wakeTimer / 0.7, 0, 0.88));
      }
      if (blackAlpha > 0.01) {
        dctx.fillStyle = `rgba(3, 4, 8, ${blackAlpha})`;
        dctx.fillRect(0, 0, PIXEL_W, PIXEL_H);
      }

      dctx.restore();
    }

    loop(now) {
      const frameDt = Math.min(0.05, Math.max(0, (now - this.lastTime) / 1000));
      this.lastTime = now;
      this.accumulator += frameDt;

      while (this.accumulator >= FIXED_DT) {
        this.stepPhysics(FIXED_DT);
        this.accumulator -= FIXED_DT;
      }

      const alpha = this.accumulator / FIXED_DT;
      this.render(alpha);
      requestAnimationFrame((t) => this.loop(t));
    }
  }

  new Game();
})();
