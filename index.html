            ctx.fillStyle = on ? led.color : '#070b14';
            ctx.fillRect(lx, ly, 1, 1);
          }
        }
      }
    }

    renderPuddlesAndReflections(ctx, intCamX, intCamY, alpha) {
      const biome = this.level.biome;
      const prx = lerp(this.player.prevX, this.player.x, alpha);
      const pry = lerp(this.player.prevY, this.player.y, alpha);

      for (const pd of this.level.puddles) {
        const px = Math.round(pd.x - intCamX);
        const py = Math.round(pd.y - intCamY);
        if (px + pd.w < 0 || px > PIXEL_W + 2 || py + pd.h < 0 || py > PIXEL_H + 2) continue;

        ctx.save();
        ctx.beginPath();
        ctx.rect(px, py - 1, pd.w, pd.h + 1);
        ctx.clip();

        if (biome === 'sector04') {
          const grad = ctx.createLinearGradient(0, py, 0, py + pd.h);
          grad.addColorStop(0, 'rgba(18, 56, 94, 0.78)');
          grad.addColorStop(0.5, 'rgba(10, 32, 62, 0.85)');
          grad.addColorStop(1, 'rgba(4, 14, 30, 0.92)');
          ctx.fillStyle = grad;
          ctx.fillRect(px, py, pd.w, pd.h);
          for (let x = 0; x < pd.w; x += 6) {
            const caustic = Math.sin(this.time * 2.1 + x * 0.14);
            if (caustic > 0.35) { ctx.fillStyle = 'rgba(110, 200, 245, 0.16)'; ctx.fillRect(px + x, py + 2, 4, 1); }
          }
        } else if (biome === 'sector07') {
          const grad = ctx.createLinearGradient(0, py, 0, py + pd.h);
          grad.addColorStop(0, 'rgba(20, 118, 102, 0.82)');
          grad.addColorStop(0.55, 'rgba(9, 68, 64, 0.90)');
          grad.addColorStop(1, 'rgba(4, 28, 30, 0.95)');
          ctx.fillStyle = grad;
          ctx.fillRect(px, py, pd.w, pd.h);
          for (let x = 0; x < pd.w; x += 3) {
            const wy = py + 3 + Math.round(Math.sin(this.time * 2.8 + x * 0.12) * 2.2);
            ctx.fillStyle = ((x + Math.floor(this.time * 6)) % 9 < 4) ? 'rgba(128, 255, 234, 0.36)' : 'rgba(35, 181, 155, 0.30)';
            ctx.fillRect(px + x, wy, 2, 1);
          }
        } else if (biome === 'amber') {
          const grad = ctx.createLinearGradient(0, py, 0, py + pd.h);
          grad.addColorStop(0, '#ffd27d');
          grad.addColorStop(0.4, '#d9711c');
          grad.addColorStop(1, '#5c1e0c');
          ctx.fillStyle = grad;
          ctx.fillRect(px, py, pd.w, pd.h);
          for (let x = 0; x < pd.w; x += 8) {
            const wy = py + 3 + Math.round(Math.sin(this.time * 1.4 + x * 0.1) * 1.6);
            ctx.fillStyle = 'rgba(255, 242, 194, 0.42)';
            ctx.fillRect(px + x, wy, 5, 1);
          }
        } else {
          const grad = ctx.createLinearGradient(0, py, 0, py + pd.h);
          grad.addColorStop(0, '#ffaa33');
          grad.addColorStop(0.45, '#e84e1b');
          grad.addColorStop(1, '#8c1d0c');
          ctx.fillStyle = grad;
          ctx.fillRect(px, py, pd.w, pd.h);
          for (let x = 0; x < pd.w; x += 12) {
            const hot = Math.sin(this.time * 3.1 + x * 0.18);
            if (hot > 0.2) { ctx.fillStyle = hot > 0.72 ? '#fff5cf' : '#ffd875'; ctx.fillRect(px + x, py + 2, 7, 2); }
          }
          const drift = this.time * 6.5;
          for (let i = 0; i < pd.w; i += 24) {
            const plateX = px + Math.round(((i + drift) % (pd.w + 20)) - 10);
            const plateW = 12 + (i % 7);
            ctx.fillStyle = '#1f0b0a'; ctx.fillRect(plateX, py + 1, plateW, 4);
            ctx.fillStyle = '#3b1511'; ctx.fillRect(plateX + 1, py + 1, plateW - 2, 2);
            ctx.fillStyle = '#732919'; ctx.fillRect(plateX + 2, py + 1, plateW - 4, 1);
          }
        }

        if (biome !== 'sector09') {
          ctx.globalAlpha = biome === 'sector07' ? 0.34 : 0.40;
          for (const cr of this.level.crystals) {
            const cx = cr.x + cr.sprite.width * 0.5;
            if (cx >= pd.x - 16 && cx <= pd.x + pd.w + 16 && Math.abs(cr.y + cr.sprite.height - pd.y) < 58) {
              const wave = Math.round(Math.sin(this.time * 4.2 + cr.x) * 1.4);
              ctx.save();
              ctx.translate(Math.round(cr.x - intCamX + wave), Math.round(2 * pd.y - (cr.y + cr.sprite.height) - intCamY + cr.sprite.height));
              ctx.scale(1, -1);
              ctx.drawImage(cr.sprite, 0, 0);
              ctx.restore();
            }
          }
          if (prx + 12 >= pd.x - 8 && prx <= pd.x + pd.w + 8 && Math.abs(pry + 18 - pd.y) < 40) {
            const frame = this.player.getRenderFrame(this.awakened);
            const distFromSurface = Math.max(0, pd.y - (pry + 18));
            const wave = Math.round(Math.sin(this.time * 6.5) * 1.5);
            ctx.save();
            ctx.translate(Math.round(prx + 6 - intCamX + wave), Math.round(py + distFromSurface));
            ctx.scale(this.player.facing, -1);
            ctx.drawImage(frame, -12, -22);
            ctx.restore();
          }
          ctx.globalAlpha = 1;
        }

        for (let x = 0; x < pd.w; x++) {
          const waveY = py + Math.round(Math.sin(this.time * 3.4 + x * 0.22) * 0.65);
          ctx.fillStyle =
            biome === 'sector04' ? (Math.sin(this.time * 2.8 + x * 0.35) > 0.3 ? '#8ee0ff' : '#3578ad')
            : biome === 'sector07' ? (Math.sin(this.time * 3.8 + x * 0.42) > 0.15 ? '#e0fff9' : '#4dffdb')
            : biome === 'amber' ? '#fff2c2'
            : (Math.sin(this.time * 3.2 + x * 0.3) > 0.1 ? '#fff5cf' : '#ffaa33');
          ctx.fillRect(px + x, waveY, 1, 1);
        }

        ctx.restore();
      }
    }

    renderWorldTooltips(ctx, intCamX, intCamY) {
      if (this.activeTerminal) {
        const tm = this.activeTerminal;
        const lines = [tm.title, ...tm.lines];
        let maxW = 0;
        for (const l of lines) maxW = Math.max(maxW, measurePixelText(l));
        const boxW = maxW + 14;
        const boxH = lines.length * 8 + 10;
        const tx = clamp(Math.round(tm.x + 10 - intCamX - boxW * 0.5), 6, PIXEL_W - boxW - 6);
        const ty = clamp(Math.round(tm.y - intCamY - boxH - 6), 6, PIXEL_H - boxH - 6);

        ctx.fillStyle = 'rgba(4, 10, 18, 0.9)';
        ctx.fillRect(tx, ty, boxW, boxH);
        ctx.fillStyle = '#38a86b';
        ctx.fillRect(tx, ty, boxW, 1);
        ctx.fillRect(tx, ty + boxH - 1, boxW, 1);
        ctx.fillRect(tx, ty, 1, boxH);
        ctx.fillRect(tx + boxW - 1, ty, 1, boxH);

        drawPixelText(ctx, tm.title, tx + 7, ty + 5, '#6ee89a', '#030408');
        for (let i = 0; i < tm.lines.length; i++) {
          drawPixelText(ctx, tm.lines[i], tx + 7, ty + 14 + i * 8, '#dce9fa', '#030408');
        }
      }

      for (const e of this.machinery.elevators) {
        if (e.mode !== 'exit') continue;
        const dist = Math.hypot(this.player.x + 6 - (e.x + 24), this.player.y + 18 - e.y);
        if (dist < 42 && e.state !== 'ascending_exit') {
          const msg = e.unlocked ? 'STEP ON LIFT TO ASCEND' : 'CORE LOCKED - RESTORE ORB';
          const col = e.unlocked ? '#6ee89a' : '#ff66d9';
          const mw = measurePixelText(msg) + 10;
          const mx = clamp(Math.round(e.x + 24 - intCamX - mw * 0.5), 4, PIXEL_W - mw - 4);
          const my = clamp(Math.round(e.y - intCamY - 26), 6, PIXEL_H - 16);
          ctx.fillStyle = 'rgba(4, 8, 16, 0.85)';
          ctx.fillRect(mx, my, mw, 10);
          drawPixelText(ctx, msg, mx + 5, my + 2, col, '#030408');
        }
      }
    }

    drawTiledParallax(ctx, img, ox, oy) {
      const w = img.width, h = img.height;
      const startX = -((Math.floor(ox) % w + w) % w);
      const startY = -((Math.floor(oy) % h + h) % h);
      for (let y = startY; y < PIXEL_H + 2; y += h) {
        for (let x = startX; x < PIXEL_W + 2; x += w) ctx.drawImage(img, x, y);
      }
    }

    renderBlurredForeground(dctx, dispW, dispH, camX, camY) {
      const sxScale = dispW / PIXEL_W, syScale = dispH / PIXEL_H;
      const pad = 14, fgX = camX * 1.3, fgY = camY * 1.3;
      dctx.save();
      dctx.imageSmoothingEnabled = true;

      const topW = 260;
      const startTop = -((Math.floor(fgX) % (topW * 2) + topW * 2) % (topW * 2));
      for (let idx = 0, x = startTop; x < PIXEL_W + topW; x += topW, idx++) {
        const chunk = this.assets.dofTopChunks[idx % this.assets.dofTopChunks.length];
        dctx.drawImage(chunk, (x - pad) * sxScale, (-pad - (fgY % 12) * 0.25) * syScale, chunk.width * sxScale, chunk.height * syScale);
      }

      const botW = 260;
      const startBot = -((Math.floor(fgX + 90) % (botW * 2) + botW * 2) % (botW * 2));
      for (let idx = 0, x = startBot; x < PIXEL_W + botW; x += botW, idx++) {
        const chunk = this.assets.dofBottomChunks[idx % this.assets.dofBottomChunks.length];
        dctx.drawImage(chunk, (x - pad) * sxScale, (PIXEL_H - 36 - pad) * syScale, chunk.width * sxScale, chunk.height * syScale);
      }

      const spire = this.assets.dofSideSpire;
      const sideBob = -((fgY * 0.3) % 60);
      dctx.drawImage(spire, (-18 - pad) * sxScale, (sideBob - pad) * syScale, spire.width * sxScale, spire.height * syScale);
      dctx.save();
      dctx.translate(dispW, 0);
      dctx.scale(-1, 1);
      dctx.drawImage(spire, (-18 - pad) * sxScale, (65 + sideBob - pad) * syScale, spire.width * sxScale, spire.height * syScale);
      dctx.restore();

      dctx.restore();
    }

    renderHUDAndOverlays(dctx, dispW, dispH) {
      const scale = dispW / PIXEL_W;
      dctx.save();
      dctx.imageSmoothingEnabled = false;
      dctx.scale(scale, scale);

      const secCode = this.level.palette.code || `CH-0${this.sectorIndex + 1}`;
      drawPixelText(dctx, `${this.sectorIndex + 1}/7 ${secCode}`, 8, 8, 'rgba(210, 230, 252, 0.72)', '#030408');
      drawPixelText(dctx, `[1-7] WARP  ${this.audio.muted ? 'M:OFF' : 'M:SFX'}`, 62, 8, 'rgba(180, 205, 235, 0.44)');

      const hudX = PIXEL_W - 66;
      const hudY = 8;
      dctx.fillStyle = 'rgba(6, 10, 20, 0.55)';
      dctx.fillRect(hudX - 4, hudY - 3, 62, 12);
      dctx.drawImage(this.assets.shardFrames[0], hudX - 2, hudY - 4, 9, 10);
      drawPixelText(dctx, `${this.totalShardsCollected}/35`, hudX + 9, hudY + 1, '#eef4ff', '#030408');

      const orbOn = this.level.orb && this.level.orb.activated;
      dctx.fillStyle = orbOn ? this.level.palette.orbColor : '#3a4a63';
      dctx.fillRect(hudX + 43, hudY + 1, 5, 5);
      if (orbOn) {
        dctx.fillStyle = '#ffffff';
        dctx.fillRect(hudX + 44, hudY + 2, 3, 3);
      }

      if (this.hintAlpha > 0.02 && this.awakened) {
        dctx.globalAlpha = this.hintAlpha * 0.85;
        const hint = 'WASD / ARROWS MOVE • SPACE JUMP • S DROP • 1-7 CHAPTERS';
        const hw = measurePixelText(hint) + 10;
        const hx = Math.round((PIXEL_W - hw) * 0.5);
        const hy = PIXEL_H - 22;
        dctx.fillStyle = 'rgba(4, 8, 18, 0.68)';
        dctx.fillRect(hx, hy - 3, hw, 11);
        drawPixelText(dctx, hint, hx + 5, hy, '#dce9fa', '#030408');
        dctx.globalAlpha = 1;
      }

      if (this.bannerTimer > 0) {
        const alpha = clamp(Math.min(this.bannerTimer, 3.5 - this.bannerTimer + 0.6) * 1.4, 0, 1);
        dctx.globalAlpha = alpha;
        const bw = measurePixelText(this.bannerText) + 14;
        const bx = Math.round((PIXEL_W - bw) * 0.5);
        const by = 22;
        dctx.fillStyle = 'rgba(8, 12, 26, 0.82)';
        dctx.fillRect(bx, by - 3, bw, 11);
        dctx.fillStyle = this.level.palette.orbColor;
        dctx.fillRect(bx, by - 3, bw, 1);
        drawPixelText(dctx, this.bannerText, bx + 7, by, '#ffffff', '#030408');
        dctx.globalAlpha = 1;
      }

      if (this.finaleActive && this.finaleTimer > 1.4) {
        const cardAlpha = clamp((this.finaleTimer - 1.4) * 1.2, 0, 1);
        dctx.globalAlpha = cardAlpha;
        const mins = String(Math.floor(this.runTime / 60)).padStart(2, '0');
        const secs = String(Math.floor(this.runTime % 60)).padStart(2, '0');
        const rows = [
          'SURFACE RELAY ONLINE',
          'ALL 7 CHAPTERS SYNCHRONIZED',
          `SHARDS RECOVERED: ${this.totalShardsCollected} / 35`,
          `DATA LOGS DECODED: ${this.totalLogsRead.size} / 14`,
          `ASCENT TIME: ${mins}:${secs}`,
          '[R] REPLAY CAMPAIGN'
        ];
        const cardW = 172;
        const cardH = 74;
        const cx = Math.round((PIXEL_W - cardW) * 0.5);
        const cy = 42;
        dctx.fillStyle = 'rgba(4, 9, 20, 0.88)';
        dctx.fillRect(cx, cy, cardW, cardH);
        dctx.fillStyle = '#d9f77a';
        dctx.fillRect(cx, cy, cardW, 1);
        dctx.fillRect(cx, cy + cardH - 1, cardW, 1);

        drawPixelText(dctx, rows[0], cx + Math.round((cardW - measurePixelText(rows[0])) * 0.5), cy + 7, '#ffffff', '#030408');
        drawPixelText(dctx, rows[1], cx + Math.round((cardW - measurePixelText(rows[1])) * 0.5), cy + 16, '#d9f77a', '#030408');
        drawPixelText(dctx, rows[2], cx + 14, cy + 29, '#ff8fa3', '#030408');
        drawPixelText(dctx, rows[3], cx + 14, cy + 38, '#6ee89a', '#030408');
        drawPixelText(dctx, rows[4], cx + 14, cy + 47, '#ffe38f', '#030408');
        drawPixelText(dctx, rows[5], cx + Math.round((cardW - measurePixelText(rows[5])) * 0.5), cy + 60, '#dce9fa', '#030408');
        dctx.globalAlpha = 1;
      }

      let blackAlpha = this.transitionAlpha;
      if (!this.awakened && this.wakeTimer < 0.7) {
        blackAlpha = Math.max(blackAlpha, clamp(1 - this.wakeTimer / 0.7, 0, 0.88));
      }
      if (blackAlpha > 0.01) {
        dctx.fillStyle = `rgba(3, 4, 8, ${blackAlpha})`;
        dctx.fillRect(0, 0, PIXEL_W, PIXEL_H);
      }

      dctx.restore();
    }

    loop(now) {
      if (window.__halted) return;
      const frameDt = Math.min(0.05, Math.max(0, (now - this.lastTime) / 1000));
      this.lastTime = now;
      this.accumulator += frameDt;

      while (this.accumulator >= FIXED_DT) {
        this.stepPhysics(FIXED_DT);
        this.accumulator -= FIXED_DT;
      }

      const alpha = this.accumulator / FIXED_DT;
      this.render(alpha);
      requestAnimationFrame((t) => this.loop(t));
    }
  }

  try {
    new Game();
  } catch (err) {
    console.error(err);
    showCanvasError((err && err.stack) ? err.stack.split('\n')[0] : String(err));
  }
})();
</script>
